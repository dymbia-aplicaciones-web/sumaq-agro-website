<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
<style>
.hero__stars circle {
    animation: twinkle 4s ease-in-out infinite;
}

.hero__stars circle:nth-child(3n) { animation-delay: 1.3s; }
.hero__stars circle:nth-child(3n + 1) { animation-delay: 2.6s; }

.hero__beam {
    animation: scan 5s ease-in-out infinite;
}

.hero__satellite {
    animation: drift 9s ease-in-out infinite;
}

.hero__phone {
    filter: drop-shadow(0 0 6px #69F0AE);
    animation: twinkle 2.5s ease-in-out infinite;
}

@keyframes twinkle {
    50% {
        opacity: .35;
    }
}
@keyframes scan {
    0%, 100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}
@keyframes drift {
    50% {
        transform: translate(1160px, 170px) rotate(-14deg);
    }
}@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>

                    <defs>
                        <radialGradient id="sun-glow">
                            <stop offset="0" stop-color="#FFE7A8" stop-opacity=".95" />
                            <stop offset=".35" stop-color="#F6C86B" stop-opacity=".45" />
                            <stop offset="1" stop-color="#F6C86B" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="scan-beam" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#69F0AE" stop-opacity=".45" />
                            <stop offset="1" stop-color="#69F0AE" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    <g fill="#fff" class="hero__stars">
                        <circle cx="120" cy="90" r="1.4" /><circle cx="260" cy="40" r="1" /><circle cx="410" cy="130" r="1.2" />
                        <circle cx="560" cy="60" r="1.6" /><circle cx="700" cy="150" r="1" /><circle cx="880" cy="70" r="1.3" />
                        <circle cx="1010" cy="30" r="1" /><circle cx="1320" cy="80" r="1.5" /><circle cx="1400" cy="190" r="1" />
                        <circle cx="60" cy="230" r="1" /><circle cx="330" cy="250" r="1.1" /><circle cx="960" cy="210" r="1" />
                    </g>
                    <circle cx="1080" cy="540" r="300" fill="url(#sun-glow)" />
                    <circle cx="1080" cy="540" r="62" fill="#FFE3A0" />
                    <path d="M560 60 Q 1060 110 1470 360" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="4 10" />
                    <polygon class="hero__beam" points="1176,170 990,700 1300,700" fill="url(#scan-beam)" />
                    <g class="hero__satellite" transform="translate(1176 162) rotate(-18)">
                        <rect x="-30" y="-4" width="20" height="8" rx="1" fill="#69F0AE" />
                        <rect x="10" y="-4" width="20" height="8" rx="1" fill="#69F0AE" />
                        <rect x="-9" y="-7" width="18" height="14" rx="3" fill="#E6F4F1" />
                        <circle cx="0" cy="9" r="2.5" fill="#E6F4F1" />
                    </g>
                
</svg>
