<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
<style>
.hero__stars circle {
    animation: twinkle 4s ease-in-out infinite;
}

.hero__stars circle:nth-child(3n) { animation-delay: 1.3s; }
.hero__stars circle:nth-child(3n + 1) { animation-delay: 2.6s; }

.hero__beam {
    animation: scan 5s ease-in-out infinite;
}

.hero__satellite {
    animation: drift 9s ease-in-out infinite;
}

.hero__phone {
    filter: drop-shadow(0 0 6px #69F0AE);
    animation: twinkle 2.5s ease-in-out infinite;
}

@keyframes twinkle {
    50% {
        opacity: .35;
    }
}
@keyframes scan {
    0%, 100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}
@keyframes drift {
    50% {
        transform: translate(1160px, 170px) rotate(-14deg);
    }
}@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>

                    <defs>
